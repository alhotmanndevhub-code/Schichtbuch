# Prüft jede Änderung mit den Tests in tests/.
# Veröffentlicht die Webseite nur, wenn alle Tests bestehen – vorausgesetzt,
# unter Settings > Pages > Build and deployment > Source ist "GitHub Actions" gewählt.
name: Prüfen und veröffentlichen

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruefen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Prüftests
    runs-on: ubuntu-latest
    steps:
      # Actions auf feste Commits gepinnt (Version dahinter), damit eine nachträglich geänderte Version nichts ausführen kann
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      # Testwerkzeuge ohne Installationsskripte (keins wird gebraucht)
      - run: npm ci --ignore-scripts
      - run: npm test

  deploy:
    name: Veröffentlichen
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Prüfen, wie GitHub Pages veröffentlicht
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo unbekannt)
          echo "build_type=$t" >> "$GITHUB_OUTPUT"
          if [ "$t" != "workflow" ]; then
            echo "::notice::GitHub Pages veröffentlicht noch direkt aus dem Branch (build_type=$t). Settings > Pages > Source auf 'GitHub Actions' stellen, damit nur geprüfte Versionen live gehen."
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: steps.mode.outputs.build_type == 'workflow'
        with:
          persist-credentials: false
      - name: Webseite zusammenstellen (ohne Tests)
        if: steps.mode.outputs.build_type == 'workflow'
        run: |
          mkdir _site
          cp index.html sw.js manifest.webmanifest exceljs.min.js *.woff2 *.png *.svg *.webp LICENSE LICENSE-*.txt LIESMICH.txt _site/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: steps.mode.outputs.build_type == 'workflow'
        with:
          path: _site
      - id: deployment
        if: steps.mode.outputs.build_type == 'workflow'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
